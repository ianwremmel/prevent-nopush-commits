on: push
name: Validate
jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: ianwremmel/prevent-fixup-commits@master
  nopush:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: test
      run: test/entrypoint.test.sh
    - name: self
      uses: ./
  nopush-container:
    runs-on: ubuntu-latest
    container: buildpack-deps:bookworm-scm
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: test
      run: test/entrypoint.test.sh
    - name: self
      uses: ./
